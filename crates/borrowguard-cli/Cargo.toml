[package]
name         = "borrowguard-cli"
description  = "BorrowGuard CLI: backtest, monitor, and later rebalance lending positions"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[[bin]]
name = "borrowguard"
path = "src/main.rs"

[dependencies]
borrowguard-core    = { workspace = true }
borrowguard-kamino  = { workspace = true }
borrowguard-jupiter = { workspace = true }
borrowguard-marginfi = { workspace = true }
borrowguard-exec    = { workspace = true }
solana-sdk          = { workspace = true }
solana-client       = { workspace = true }
dotenvy             = { workspace = true }
anyhow              = { workspace = true }
clap                = { workspace = true }
csv                 = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
chrono              = { workspace = true }
reqwest             = { workspace = true }
toml                = { workspace = true }
solana-account-decoder = { workspace = true }
tokio               = { workspace = true }
futures-util        = { workspace = true }
tokio-stream        = { workspace = true, optional = true }
tonic               = { workspace = true, optional = true }
yellowstone-grpc-proto = { workspace = true, optional = true }

[features]
# Stream account updates over gRPC (`--stream grpc`). Off by default: it adds
# a heavy dependency tree most setups don't need.
grpc = ["dep:tonic", "dep:yellowstone-grpc-proto", "dep:tokio-stream"]
