[workspace]
resolver = "2"
members = [
    "crates/borrowguard-core",
    "crates/borrowguard-exec",
    "crates/borrowguard-kamino",
    "crates/borrowguard-jupiter",
    "crates/borrowguard-marginfi",
    "crates/borrowguard-cli",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.86"
license      = "MIT"
repository   = "https://github.com/anshuman008/borrowguard"

[workspace.dependencies]
borrowguard-core   = { path = "crates/borrowguard-core" }
borrowguard-exec   = { path = "crates/borrowguard-exec" }
borrowguard-kamino = { path = "crates/borrowguard-kamino" }
borrowguard-jupiter = { path = "crates/borrowguard-jupiter" }
borrowguard-marginfi = { path = "crates/borrowguard-marginfi" }

anyhow     = "1"
thiserror  = "2"
clap       = { version = "4", features = ["derive", "env", "wrap_help"] }
csv        = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = "0.4"
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dotenvy    = "0.15"
base64     = "0.22"
toml       = "0.8"
bincode    = "1.3"
bytemuck   = { version = "1", features = ["derive", "min_const_generics"] }

# Solana client stack, pinned together. solana-sdk's default `full` feature
# pulls openssl via secp256r1; tx composition needs none of it.
solana-program         = "=2.1.20"
solana-sdk             = { version = "=2.1.20", default-features = false }
solana-client          = "=2.1.20"
solana-account-decoder = "=2.1.20"

# Streaming account updates (`watch --stream`).
tokio        = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures-util = "0.3"
# gRPC (Yellowstone / Helius LaserStream / Triton), behind the CLI's `grpc`
# feature. The proto crate's default compression features are left off: with
# them, tonic subscriptions are known to connect but never deliver data.
tokio-stream           = "0.1"
tonic                  = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
yellowstone-grpc-proto = { version = "=12.1.0", default-features = false, features = ["tonic"] }
